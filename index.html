<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151a">
<meta name="description" content="MARYSE — Le copilote des métiers de bouche">
<link rel="manifest" href="./manifest.webmanifest">
<title>MARYSE — Le copilote des métiers de bouche</title>

<style>
:root{
  --bg:#0e1216;
  --panel:#151b21;
  --panel2:#1b232b;
  --panel3:#202a33;
  --text:#f3f5f6;
  --muted:#aab4bd;
  --line:#303b45;
  --accent:#d6b36a;
  --accent2:#ead59d;
  --green:#6fcf97;
  --orange:#e8a35b;
  --red:#e87878;
  --blue:#70a9e8;
  --shadow:0 18px 45px rgba(0,0,0,.28);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
header{
  position:sticky;top:0;z-index:30;
  background:rgba(14,18,22,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1500px;margin:auto;padding:13px 18px;
  display:flex;align-items:center;gap:18px
}
.brand{display:flex;align-items:center;gap:12px;min-width:230px}
.brand-mark{
  width:48px;height:48px;border-radius:15px;
  background:linear-gradient(145deg,#ead59d,#a98443);
  color:#17130b;display:grid;place-items:center;
  font-weight:900;font-size:24px;box-shadow:0 8px 25px rgba(214,179,106,.18)
}
.brand-title{font-size:23px;font-weight:900;letter-spacing:.08em}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.header-company{margin-left:auto;display:flex;align-items:center;gap:10px}
.company-pill{
  padding:9px 13px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);font-size:13px;color:var(--muted)
}
main{max-width:1500px;margin:auto;padding:22px 18px 90px}
.nav{
  display:flex;gap:7px;overflow:auto;padding:5px 0 18px;
  scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:12px;padding:10px 13px
}
.nav button.active,.nav button:hover{
  color:#17130b;background:var(--accent);border-color:var(--accent)
}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:5px 0 22px}
.page-head h1{font-size:29px;margin:0 0 5px}
.page-head p{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:12px;padding:10px 14px
}
.btn:hover{border-color:#66727d}
.btn.primary{background:var(--accent);color:#16120b;border-color:var(--accent);font-weight:800}
.btn.danger{border-color:#663b3b;color:#ffb0b0}
.btn.small{padding:7px 10px;font-size:13px}
.grid{display:grid;gap:15px}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  background:linear-gradient(145deg,var(--panel),#12171c);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.12)
}
.card h2,.card h3{margin:0 0 8px}
.card p{color:var(--muted)}
.stat{min-height:125px}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-size:30px;font-weight:850;margin-top:10px}
.stat .detail{font-size:12px;color:var(--muted);margin-top:5px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:#12171c}
td{font-size:14px}
tr:last-child td{border-bottom:0}
.badge{
  display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;
  background:var(--panel3);font-size:11px;color:var(--muted)
}
.badge.green{color:#a5e8bf;background:#173527}
.badge.orange{color:#ffd19d;background:#3b2817}
.badge.red{color:#ffb5b5;background:#3b1e20}
.badge.blue{color:#b5d7ff;background:#182c43}
.empty{text-align:center;padding:35px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);background:#0e1317;color:var(--text);
  border-radius:11px;padding:11px 12px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:90px;resize:vertical}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;
  display:none;align-items:center;justify-content:center;padding:18px
}
.modal.show{display:flex}
.modal-box{
  width:min(760px,100%);max-height:92vh;overflow:auto;
  background:#151b21;border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:20px
}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.modal-head h2{margin:0}
.close{background:transparent;border:0;color:var(--muted);font-size:26px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:200;
  background:#202a33;border:1px solid var(--line);padding:13px 16px;
  border-radius:13px;box-shadow:var(--shadow);display:none;max-width:360px
}
.toast.show{display:block}
.voice-card{
  background:linear-gradient(145deg,#1c252d,#12171c);
  border:1px solid #4a4130;border-radius:24px;padding:25px;
  box-shadow:var(--shadow)
}
.voice-orb{
  width:105px;height:105px;border-radius:50%;margin:8px auto 18px;
  background:radial-gradient(circle at 35% 30%,#f3dfad,#a98443);
  display:grid;place-items:center;color:#17130b;font-size:42px;
  box-shadow:0 0 0 8px rgba(214,179,106,.08),0 12px 40px rgba(214,179,106,.18)
}
.voice-orb.live{animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 20px rgba(214,179,106,.05),0 12px 45px rgba(214,179,106,.25)}}
.voice-state{text-align:center;font-weight:800}
.voice-status{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 18px}
.voice-input{display:flex;gap:8px}
.voice-input input{flex:1;border:1px solid var(--line);background:#0e1317;color:white;border-radius:12px;padding:12px}
.voice-log{display:flex;flex-direction:column;gap:9px;margin-top:18px;max-height:390px;overflow:auto}
.bubble{padding:11px 13px;border-radius:14px;max-width:90%;line-height:1.4}
.bubble.me{align-self:flex-end;background:#28343e}
.bubble.maryse{align-self:flex-start;background:#202a33;border:1px solid var(--line)}
.bubble small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}
.hero{
  background:
    radial-gradient(circle at 80% 20%,rgba(214,179,106,.13),transparent 32%),
    linear-gradient(145deg,#1a2229,#11161a);
  border:1px solid var(--line);border-radius:24px;padding:27px;margin-bottom:16px
}
.hero h1{font-size:36px;margin:0 0 7px}
.hero p{max-width:800px;color:var(--muted);font-size:16px}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.quick button{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:15px;padding:17px 10px;text-align:left
}
.quick button strong{display:block;margin-top:8px}
.quick button span{font-size:12px;color:var(--muted)}
.notice{padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:#141b21;color:var(--muted);font-size:13px}
.kpi-up{color:var(--green)}
.kpi-warn{color:var(--orange)}
.footer{
  margin-top:35px;padding:22px 0;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap
}
@media(max-width:1000px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr 1fr}
  .quick{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:680px){
  .header-inner{padding:10px 12px}
  .brand{min-width:0}.brand-title{font-size:19px}.brand-mark{width:42px;height:42px}
  .header-company{display:none}
  main{padding:15px 12px 80px}
  .page-head{display:block}.page-head .actions{margin-top:12px}
  .grid4,.grid3,.grid2{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .hero h1{font-size:29px}
  .voice-input{flex-direction:column}
}/* =========================================================

<body>
<div class="app">

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-title">MARYSE</div>
        <div class="brand-sub">Le copilote des métiers de bouche</div>
      </div>
    </div>
    <div class="header-company">
      <div class="company-pill" id="companyPill">Mon établissement</div>
      <button class="btn small" onclick="openCompany()">🏢 Société</button>
    </div>
  </div>
</header>

<main>
  <nav class="nav" id="nav"></nav>
  <section id="appView"></section>

  <footer class="footer">
    <div><strong>MARYSE</strong> — Le copilote des métiers de bouche</div>
    <div>Créé par Sébastien Zevaco · © 2026 MARYSE — Tous droits réservés</div>
  </footer>
</main>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">MARYSE</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   MARYSE V6
   Le copilote des métiers de bouche
   Créé par Sébastien Zevaco
   ========================================================= */

const VERSION="6.0.0";
const KEY="maryse-v6-data";

const NAV=[
  ["home","🏠","Accueil"],
  ["clients","👥","Clients"],
  ["suppliers","🚚","Fournisseurs"],
  ["recipes","🍽️","Recettes"],
  ["stock","📦","Stock"],
  ["purchases","🛒","Achats"],
  ["planning","📅","Planning"],
  ["staff","👨‍🍳","Personnel"],
  ["management","💰","Gestion"],
  ["voice","🎙️","Conversation"],
  ["legal","⚖️","Infos légales"]
];

const DEFAULT={
  company:{
    name:"Mon établissement",
    activity:"Métiers de bouche",
    address:"",
    phone:"",
    email:"",
    siret:""
  },
  clients:[],
  suppliers:[],
  recipes:[],
  stock:[],
  purchases:[],
  events:[],
  staff:[],
  sales:[],
  traceability:[],
  notes:[],
  settings:{
    voice:true,
    notifications:true
  }
};

let data=loadData();
let currentPage="home";
let recognition=null;
let micReady=false;
let voiceContext=null;

function clone(o){
  return JSON.parse(JSON.stringify(o));
}

function loadData(){
  try{
    const saved=localStorage.getItem(KEY);
    if(saved){
      const parsed=JSON.parse(saved);
      return Object.assign(clone(DEFAULT),parsed);
    }
  }catch(e){}
  return clone(DEFAULT);
}

function saveData(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function money(v){
  return Number(v||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
}

function dateFR(v){
  if(!v)return "—";
  const d=new Date(v);
  if(isNaN(d))return esc(v);
  return d.toLocaleDateString("fr-FR");
}

function uid(prefix="id"){
  return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.remove("show"),2800);
}

function renderNav(){
  document.getElementById("nav").innerHTML=NAV.map(n=>
    `<button class="${currentPage===n[0]?"active":""}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`
  ).join("");
}

function go(page){
  currentPage=page;
  renderNav();
  renderPage();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderPage(){
  const v=document.getElementById("appView");
  const pages={
    home:renderHome,
    clients:renderClients,
    suppliers:renderSuppliers,
    recipes:renderRecipes,
    stock:renderStock,

function validateInventory(){
  data.stock.forEach((x,i)=>{
    const real=Number(document.getElementById("real_"+i)?.value);
    if(!isNaN(real)){
      const old=Number(x.qty||0);
      const gap=real-old;
      if(gap!==0)data.traceability.push({id:uid("trace"),date:new Date().toISOString(),type:"Écart inventaire",article:x.name,theoretical:old,actual:real,gap});
      x.qty=real;
    }
  });
  saveData();closeModal();renderPage();toast("Inventaire validé ✓");
}

/* =========================================================
   MARYSE — CONVERSATION VOCALE CONTINUE
   ========================================================= */

let recognition = null;
let micReady = false;
let conversationActive = false;
let restartingRecognition = false;
let maryseSpeaking = false;

function setMicStatus(title,detail){
  const el=document.getElementById("micStatus");
  const state=document.getElementById("voiceState");

  if(el){
    el.innerHTML="<strong>"+esc(title)+"</strong><br>"+esc(detail);
  }

  if(state){
    state.textContent=conversationActive
      ?"Conversation active"
      :"Microphone prêt";
  }
}

async function checkMicrophone(){
  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    setMicStatus(
      "🔴 Microphone indisponible",
      "Utilisez Chrome sur la version HTTPS de MARYSE."
    );
    return false;
  }

  try{
    const stream=
      await navigator.mediaDevices.getUserMedia({audio:true});

    stream.getTracks().forEach(t=>t.stop());

    micReady=true;

    setMicStatus(
      "🟢 Microphone autorisé",
      "MARYSE peut maintenant vous écouter."
    );

    return true;

  }catch(e){

    micReady=false;

    setMicStatus(
      "🔴 Autorisation nécessaire",
      "Autorisez le microphone pour Chrome puis réessayez."
    );

    return false;
  }
}


/* =========================================================
   SYNTHÈSE VOCALE DE MARYSE
   Après chaque réponse, MARYSE relance automatiquement l'écoute.
   ========================================================= */

function speak(t){

  if(!("speechSynthesis" in window)){

    if(conversationActive){
      setTimeout(startContinuousListening,500);
    }

    return;
  }

  speechSynthesis.cancel();

  maryseSpeaking=true;

  const u=new SpeechSynthesisUtterance(t);

  u.lang="fr-FR";
  u.rate=.95;
  u.pitch=1.05;
  u.volume=1;

  const voices=speechSynthesis.getVoices();

  const female=voices.find(v=>
    v.lang.toLowerCase().startsWith("fr") &&
    /female|femme|google français|microsoft/i.test(v.name)
  );

  const french=voices.find(v=>
    v.lang.toLowerCase().startsWith("fr")
  );

  if(female)u.voice=female;
  else if(french)u.voice=french;

  u.onend=function(){

    maryseSpeaking=false;

    if(conversationActive){
      setTimeout(startContinuousListening,350);
    }
  };

  u.onerror=function(){

    maryseSpeaking=false;

    if(conversationActive){
      setTimeout(startContinuousListening,500);
    }
  };

  speechSynthesis.speak(u);
}


/* =========================================================
   ÉCOUTE CONTINUE
   ========================================================= */

function startContinuousListening(){

  if(!conversationActive)return;
  if(maryseSpeaking)return;
  if(restartingRecognition)return;

  const SR=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    setMicStatus(
      "🟠 Reconnaissance vocale indisponible",
      "Votre navigateur ne fournit pas la reconnaissance vocale."
    );

    conversationActive=false;

    return;
  }

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

    recognition=null;
  }

  restartingRecognition=true;

  setTimeout(function(){

    restartingRecognition=false;

    if(!conversationActive)return;

    try{

      recognition=new SR();

      recognition.lang="fr-FR";
      recognition.continuous=false;
      recognition.interimResults=false;
      recognition.maxAlternatives=1;


      recognition.onstart=function(){

        setMicStatus(
          "🟢 Conversation active",
          "MARYSE vous écoute…"
        );

        const state=
          document.getElementById("voiceState");

        if(state){
          state.textContent="Je vous écoute…";
        }

        const orb=
          document.getElementById("voiceOrb");

        if(orb){
          orb.classList.add("live");
        }
      };


      recognition.onresult=function(e){

        if(!conversationActive)return;

        const result=
          e.results &&
          e.results[0] &&
          e.results[0][0];

        if(!result)return;

        const text=
          result.transcript.trim();

        if(!text)return;

        const lower=
          text.toLowerCase();


        /* Commandes d'arrêt */

        if(
          lower.includes("maryse arrête") ||
          lower.includes("maryse stop") ||
          lower.includes("arrête la conversation") ||
          lower.includes("arrêter la conversation") ||
          lower==="stop"
        ){

          stopContinuousConversation();

          speak(
            "D’accord, j’arrête la conversation."
          );

          return;
        }


        /* Envoi vers le cerveau conversationnel existant */

        voiceAsk(text);
      };


      recognition.onerror=function(e){

        recognition=null;

        const error=
          e && e.error ? e.error : "";


        if(
          error==="not-allowed" ||
          error==="service-not-allowed"
        ){

          micReady=false;

          setMicStatus(
            "🔴 Microphone bloqué",
            "Autorisez le microphone dans Chrome puis relancez la conversation."
          );

          conversationActive=false;

          return;
        }


        if(error==="audio-capture"){

          setMicStatus(
            "🔴 Microphone inaccessible",
            "Vérifiez qu’aucune autre application n’utilise le microphone."
          );

          conversationActive=false;

          return;
        }


        if(conversationActive){

          setTimeout(
            startContinuousListening,
            600
          );
        }
      };


      recognition.onend=function(){

        recognition=null;

        const orb=
          document.getElementById("voiceOrb");

        if(orb){
          orb.classList.remove("live");
        }

        /*
          Si MARYSE vient de finir son écoute,
          elle recommence automatiquement.
        */

        if(
          conversationActive &&
          !maryseSpeaking
        ){

          setTimeout(
            startContinuousListening,
            350
          );
        }
      };


      recognition.start();

    }catch(e){

      recognition=null;

      if(conversationActive){

        setTimeout(
          startContinuousListening,
          800
        );
      }
    }

  },100);
}


/* =========================================================
   BOUTON MICRO
   ========================================================= */

async function toggleVoice(){

  /* Si une conversation est déjà active :
     le bouton sert à l'arrêter. */

  if(conversationActive){

    stopContinuousConversation();

    return;
  }


  /* Vérification du microphone */

  const ok=
    micReady ||
    await checkMicrophone();

  if(!ok)return;


  /* Démarrage de la conversation */

  conversationActive=true;

  setMicStatus(
    "🟢 Conversation active",
    "MARYSE est prête. Vous pouvez parler naturellement."
  );

  const state=
    document.getElementById("voiceState");

  if(state){
    state.textContent="Conversation active";
  }

  const orb=
    document.getElementById("voiceOrb");

  if(orb){
    orb.classList.add("active");
  }


  /* MARYSE parle puis écoute automatiquement */

  speak(
    "Bonjour, je suis MARYSE. Je vous écoute."
  );
}


/* =========================================================
   ARRÊT DE LA CONVERSATION
   ========================================================= */

function stopContinuousConversation(){

  conversationActive=false;

  restartingRecognition=false;


  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

    recognition=null;
  }


  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

  maryseSpeaking=false;


  const orb=
    document.getElementById("voiceOrb");

  if(orb){
    orb.classList.remove("live");
    orb.classList.remove("active");
  }


  const state=
    document.getElementById("voiceState");

  if(state){
    state.textContent="Conversation arrêtée";
  }


  setMicStatus(
    "🟢 Microphone prêt",
    "Appuyez sur 🎙️ pour reprendre la conversation."
  );
}

function renderVoice(){

  if(
    navigator.permissions &&
    navigator.permissions.query
  ){

    navigator.permissions
      .query({name:"microphone"})
      .then(function(p){

        if(p.state==="granted"){

          micReady=true;

          setMicStatus(
            "🟢 Microphone déjà autorisé",
            "Appuyez sur 🎙️ pour démarrer la conversation."
          );

        }else if(p.state==="denied"){

          setMicStatus(
            "🔴 Microphone bloqué",
            "Autorisez le microphone dans les réglages du navigateur."
          );
        }

      })
      .catch(function(){});
  }
}

function voiceAsk(raw){
  raw=String(raw).trim();
  if(!raw)return;
  addVoice("Vous",raw);

  if(voiceContext){
    handleVoiceContext(raw);
    return;
  }

  const l=raw.toLowerCase();

  /* Recherche client */
  if(/\b(recherche|chercher|cherche|trouve|trouver|affiche|afficher)\b/.test(l)&&/\b(client|cliente)\b/.test(l)){
    const m=raw.match(/(?:client|cliente)\s+(?:nommé|nomme|appelé|appele)?\s*(.+)$/i);
    const name=m?m[1].trim():"";
    if(name){
      const found=data.clients.filter(x=>(x.name+" "+x.first).toLowerCase().includes(name.toLowerCase()));
      if(found.length){
        maryse("J'ai trouvé "+found.length+" client"+(found.length>1?"s":"")+" correspondant à « "+name+" ».");
        showSearchResults(found);
      }else{
        maryse("Je n'ai trouvé aucun client correspondant à « "+name+" ».");
      }
    }else{
      voiceContext={type:"client-search",step:"name",data:{}};
      maryse("Bien sûr. Quel est le nom du client que vous recherchez ?");
    }
    return;
  }

  /* Création client */
  if(/\b(client|cliente)\b/.test(l)&&/\b(crée|creer|créer|nouveau|nouvelle|ajoute|ajouter)\b/.test(l)){
    const m=raw.match(/(?:client|cliente)\s+(?:nommé|nomme|appelé|appele)?\s*(.+)$/i);
    const name=m?m[1].trim():"";
    voiceContext={type:"client",step:"first",data:{name}};
    maryse(name?"Très bien. Quel est son prénom ?":"Très bien. Quel est le nom du nouveau client ?");
    if(name)voiceContext.step="first";
    else voiceContext.step="name";
    return;
  }

  /* Fournisseur */
  if(/\b(fournisseur|grossiste|producteur)\b/.test(l)&&/\b(crée|creer|créer|nouveau|nouvelle|ajoute|ajouter)\b/.test(l)){
    const m=raw.match(/(?:fournisseur|grossiste|producteur)\s+(?:nommé|nomme|appelé|appele)?\s*(.+)$/i);
    const name=m?m[1].trim():"";
    voiceContext={type:"supplier",step:name?"contact":"name",data:{name}};
    maryse(name?"Très bien. Quel est le nom de votre contact ?":"Très bien. Quel est le nom du fournisseur ?");
    return;
  }

  /* Recette */
  if(/\b(recette|fiche technique)\b/.test(l)&&/\b(crée|creer|créer|nouveau|nouvelle|ajoute|ajouter)\b/.test(l)){
    const m=raw.match(/(?:recette|fiche technique)\s+(?:de|pour|nommée|nommee)?\s*(.+)$/i);
    const name=m?m[1].trim():"";
    voiceContext={type:"recipe",step:name?"yield":"name",data:{name}};
    maryse(name?"Pour combien de portions ?":"Très bien. Quel est le nom de la recette ?");
    return;
  }

  /* Stock */
  if(/\b(stock|inventaire)\b/.test(l)){
    const quantityMatch=raw.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|l|L|cl|pièces?|piece|cartons?)/i);
    const qty=quantityMatch?quantityMatch[1]:"";
    const unit=quantityMatch?quantityMatch[2]:"";
    const name=raw.replace(/ok\s*maryse/ig,"").replace(/(?:ajoute|ajouter|enregistre|enregistrer|dans le stock|au stock|stock|inventaire)/ig,"").replace(/\d+(?:[.,]\d+)?\s*(kg|g|l|L|cl|pièces?|piece|cartons?)/ig,"").trim();
    if(qty&&name){
      data.stock.push({id:uid("stock"),name:name,ref:"",unit:unit.toLowerCase(),qty:Number(qty.replace(",",".")),min:0,price:0,supplier:"",lot:"",expiry:""});
      saveData();
      maryse("C'est enregistré : "+qty+" "+unit+" de "+name+".");
    }else{
      voiceContext={type:"stock",step:"name",data:{}};
      maryse("Très bien. Quel article souhaitez-vous ajouter au stock ?");
    }
    return;
  }

  /* Achat */
  if(/\b(achat|commande)\b/.test(l)&&/\b(crée|creer|créer|nouveau|nouvelle|enregistre|enregistrer|ajoute|ajouter)\b/.test(l)){
    voiceContext={type:"purchase",step:"supplier",data:{}};
    maryse("Très bien. Chez quel fournisseur ?");
    return;
  }

  /* Planning */
  if(/\b(prestation|événement|evenement|livraison|planning)\b/.test(l)&&/\b(crée|creer|créer|nouveau|nouvelle|ajoute|ajouter|programme|programmer)\b/.test(l)){
    voiceContext={type:"event",step:"title",data:{}};
    maryse("Très bien. Quel est le nom de la prestation ?");
    return;
  }

  /* Personnel */
  if(/\b(salarié|salariée|employé|employée|personnel|collaborateur|collaboratrice)\b/.test(l)&&/\b(crée|creer|créer|nouveau|nouvelle|ajoute|ajouter)\b/.test(l)){
    voiceContext={type:"staff",step:"name",data:{}};
    maryse("Très bien. Quel est le nom et prénom du salarié ?");
    return;
  }

  if(/\bbonjour\b|\bsalut\b|\bbonsoir\b/.test(l)){
    maryse("Bonjour. Je suis prête. Que souhaitez-vous faire ?");
    return;
  }

  if(/\bcombien\b.*\bvente|chiffre d.?affaires\b/.test(l)){
    const ca=data.sales.reduce((s,x)=>s+Number(x.amount||0),0);
    maryse("Le chiffre d'affaires enregistré dans MARYSE est de "+money(ca)+".");
    return;
  }

  if(/\bouvre?\b.*\bclient/i.test(l)){go("clients");maryse("J'ouvre la rubrique Clients.");return}
  if(/\bouvre?\b.*\bfournisseur/i.test(l)){go("suppliers");maryse("J'ouvre la rubrique Fournisseurs.");return}
  if(/\bouvre?\b.*\brecette/i.test(l)){go("recipes");maryse("J'ouvre les Recettes.");return}
  if(/\bouvre?\b.*\bstock/i.test(l)){go("stock");maryse("J'ouvre le Stock.");return}
  if(/\bouvre?\b.*\bachat/i.test(l)){go("purchases");maryse("J'ouvre les Achats.");return}
  if(/\bouvre?\b.*\bplanning/i.test(l)){go("planning");maryse("J'ouvre le Planning.");return}
  if(/\bouvre?\b.*\bpersonnel/i.test(l)){go("staff");maryse("J'ouvre le Personnel.");return}
  if(/\bouvre?\b.*\bgestion/i.test(l)){go("management");maryse("J'ouvre la Gestion.");return}

  maryse("Je peux vous aider avec les clients, fournisseurs, recettes, stock, achats, planning, personnel ou gestion. Dites-moi simplement ce que vous souhaitez faire.");
}

function handleVoiceContext(raw){
  const c=voiceContext;
  const value=raw.trim();

  if(c.type==="client"){
    if(c.step==="name"){c.data.name=value;c.step="first";maryse("Quel est son prénom ?");return}
    if(c.step==="first"){c.data.first=value;c.step="phone";maryse("Quel est son numéro de téléphone ?");return}
    if(c.step==="phone"){c.data.phone=value;c.step="email";maryse("Quelle est son adresse e-mail ?");return}
    if(c.step==="email"){c.data.email=value;c.step="address";maryse("Quelle est son adresse ?");return}
    if(c.step==="address"){c.data.address=value;c.step="city";maryse("Dans quelle ville et quel code postal ?");return}
    if(c.step==="city"){
      const m=value.match(/^(\d{5})\s+(.+)$/);
      if(m){c.data.zip=m[1];c.data.city=m[2]}else c.data.city=value;
      c.step="notes";maryse("Avez-vous une remarque ou une note à ajouter ? Vous pouvez dire « aucune ».");return;
    }
    if(c.step==="notes"){
      c.data.notes=/^(aucune|non|rien)$/i.test(value)?"":value;
      c.step="confirm";
      maryse("Récapitulatif : "+c.data.name+" "+c.data.first+", téléphone "+(c.data.phone||"non renseigné")+", e-mail "+(c.data.email||"non renseigné")+", "+(c.data.city||"ville non renseignée")+". Dois-je créer cette fiche ?");
      return;
    }
    if(c.step==="confirm"){
      if(/^(oui|oui c.?est bon|confirme|confirmer|vas-y|enregistre|enregistrer)$/i.test(value)){
        data.clients.push(Object.assign({id:uid("client")},c.data));
        saveData();voiceContext=null;
        maryse("C'est fait. La fiche client est enregistrée.");
        go("clients");
      }else{
        voiceContext=null;
        maryse("D'accord, je n'enregistre rien. Nous pouvons recommencer.");
      }
      return;
    }
  }

  if(c.type==="client-search"){
    if(c.step==="name"){
      const found=data.clients.filter(x=>(x.name+" "+x.first).toLowerCase().includes(value.toLowerCase()));
      voiceContext=null;
      if(found.length){maryse("J'ai trouvé "+found.length+" résultat"+(found.length>1?"s":"")+".");showSearchResults(found)}
      else maryse("Je n'ai trouvé aucun client portant ce nom.");
      return;
    }
  }

  if(c.type==="supplier"){
    if(c.step==="name"){c.data.name=value;c.step="contact";maryse("Quel est le nom de votre contact ?");return}
    if(c.step==="contact"){c.data.contact=value;c.step="phone";maryse("Quel est son numéro de téléphone ?");return}
    if(c.step==="phone"){c.data.phone=value;c.step="email";maryse("Quelle est son adresse e-mail ?");return}
    if(c.step==="email"){c.data.email=value;c.step="products";maryse("Quels produits ou références propose ce fournisseur ?");return}
    if(c.step==="products"){c.data.products=value;c.step="address";maryse("Quelle est son adresse ?");return}
    if(c.step==="address"){c.data.address=value;c.step="confirm";maryse("J'ai les informations. Dois-je enregistrer ce fournisseur ?");return}
    if(c.step==="confirm"){
      if(/^oui|confirme|enregistre|vas-y/i.test(value)){
        data.suppliers.push(Object.assign({id:uid("supplier")},c.data));
        saveData();voiceContext=null;maryse("Fournisseur enregistré.");go("suppliers");
      }else{voiceContext=null;maryse("D'accord, je n'enregistre rien.");}
      return;
    }
  }

  if(c.type==="recipe"){
    if(c.step==="name"){c.data.name=value;c.step="yield";maryse("Pour combien de portions ?");return}
    if(c.step==="yield"){c.data.yield=value;c.step="ingredients";maryse("Quels sont les ingrédients et leurs quantités ?");return}
    if(c.step==="ingredients"){c.data.ingredients=value;c.step="tools";maryse("Quels ustensiles ou matériels faut-il ?");return}
    if(c.step==="tools"){c.data.tools=value;c.step="steps";maryse("Décrivez la préparation.");return}
    if(c.step==="steps"){c.data.steps=value;c.step="cost";maryse("Quel est le coût matière approximatif ?");return}
    if(c.step==="cost"){c.data.cost=Number(value.replace(",",".").replace(/[^\d.]/g,""))||0;c.step="confirm";maryse("La fiche « "+c.data.name+" » est prête. Dois-je l'enregistrer ?");return}
    if(c.step==="confirm"){
      if(/^oui|confirme|enregistre|vas-y/i.test(value)){
        data.recipes.push(Object.assign({id:uid("recipe")},c.data));
        saveData();voiceContext=null;maryse("Recette enregistrée.");go("recipes");
      }else{voiceContext=null;maryse("D'accord, je n'enregistre rien.");}
      return;
    }
  }

  if(c.type==="stock"){
    if(c.step==="name"){c.data.name=value;c.step="qty";maryse("Quelle quantité et quelle unité ?");return}
    if(c.step==="qty"){
      const m=value.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|l|L|cl|pièces?|piece|cartons?)/i);
      c.data.qty=m?Number(m[1].replace(",",".")):Number(value.replace(",","."));
      c.data.unit=m?m[2]:"pièce";
      c.step="min";maryse("Quel est le seuil minimum de réapprovisionnement ?");return;
    }
    if(c.step==="min"){c.data.min=Number(value.replace(",","."))||0;c.step="confirm";maryse("Je vais ajouter "+c.data.qty+" "+c.data.unit+" de "+c.data.name+". Dois-je valider ?");return}
    if(c.step==="confirm"){
      if(/^oui|confirme|valide|enregistre/i.test(value)){
        data.stock.push({id:uid("stock"),name:c.data.name,ref:"",unit:c.data.unit,qty:c.data.qty,min:c.data.min,price:0,supplier:"",lot:"",expiry:""});
        saveData();voiceContext=null;maryse("Article ajouté au stock.");go("stock");
      }else{voiceContext=null;maryse("D'accord.");}
      return;
    }
  }

  if(c.type==="purchase"){
    if(c.step==="supplier"){c.data.supplier=value;c.step="product";maryse("Quel produit avez-vous acheté ?");return}
    if(c.step==="product"){c.data.product=value;c.step="qty";maryse("Quelle quantité ?");return}
    if(c.step==="qty"){c.data.qty=value;c.step="total";maryse("Quel est le montant total de l'achat ?");return}
    if(c.step==="total"){c.data.total=Number(value.replace(",","."))||0;c.step="confirm";maryse("Achat de "+c.data.product+" chez "+c.data.supplier+" pour "+money(c.data.total)+". Dois-je enregistrer ?");return}
    if(c.step==="confirm"){
      if(/^oui|confirme|enregistre|vas-y/i.test(value)){
        data.purchases.push({id:uid("purchase"),date:new Date().toISOString().slice(0,10),supplier:c.data.supplier,product:c.data.product,qty:c.data.qty,unitPrice:0,total:c.data.total,status:"Réceptionné",notes:""});
        saveData();voiceContext=null;maryse("Achat enregistré.");go("purchases");
      }else{voiceContext=null;maryse("D'accord.");}
      return;
    }
  }

  if(c.type==="event"){
    if(c.step==="title"){c.data.title=value;c.step="date";maryse("Quelle date ?");return}
    if(c.step==="date"){c.data.date=parseNaturalDate(value);c.step="time";maryse("À quelle heure ?");return}
    if(c.step==="time"){c.data.time=parseTime(value);c.step="client";maryse("Pour quel client ou quelle entreprise ?");return}
    if(c.step==="client"){c.data.client=value;c.step="location";maryse("Où se déroule la prestation ?");return}
    if(c.step==="location"){c.data.location=value;c.step="confirm";maryse("Je peux maintenant créer la prestation. Dois-je l'enregistrer ?");return}
    if(c.step==="confirm"){
      if(/^oui|confirme|enregistre|vas-y/i.test(value)){
        data.events.push({id:uid("event"),title:c.data.title,date:c.data.date,time:c.data.time,type:"Professionnel",client:c.data.client,location:c.data.location,priority:"Normal",staff:"",notes:""});
        saveData();voiceContext=null;maryse("Prestation enregistrée dans le planning.");go("planning");
      }else{voiceContext=null;maryse("D'accord.");}
      return;
    }
  }

  if(c.type==="staff"){
    if(c.step==="name"){c.data.name=value;c.step="role";maryse("Quelle est sa fonction ?");return}
    if(c.step==="role"){c.data.role=value;c.step="contract";maryse("Quel est son type de contrat ?");return}
    if(c.step==="contract"){c.data.contract=value;c.step="entry";maryse("Quelle est sa date d'entrée ?");return}
    if(c.step==="entry"){c.data.entry=parseNaturalDate(value);c.step="hours";maryse("Combien d'heures sont prévues par semaine ?");return}
    if(c.step==="hours"){c.data.plannedHours=Number(value.replace(",","."))||0;c.step="confirm";maryse("Je vais créer la fiche de "+c.data.name+", fonction "+c.data.role+", contrat "+c.data.contract+". Dois-je l'enregistrer ?");return}
    if(c.step==="confirm"){
      if(/^oui|confirme|enregistre|vas-y/i.test(value)){
        data.staff.push({id:uid("staff"),name:c.data.name,role:c.data.role,contract:c.data.contract,entry:c.data.entry,phone:"",email:"",qualifications:"",plannedHours:c.data.plannedHours,actualHours:0,schedule:"",leave:"",notes:""});
        saveData();voiceContext=null;maryse("Fiche personnel enregistrée.");go("staff");
      }else{voiceContext=null;maryse("D'accord.");}
      return;
    }
  }

  voiceContext=null;
  maryse("Je n'ai pas compris cette étape. Nous pouvons recommencer.");
}

function parseNaturalDate(text){
  const t=text.toLowerCase();
  const d=new Date();
  if(t.includes("demain"))d.setDate(d.getDate()+1);
  else if(t.includes("après-demain")||t.includes("apres-demain"))d.setDate(d.getDate()+2);
  else{
    const m=t.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
    if(m){
      d.setDate(Number(m[1]));d.setMonth(Number(m[2])-1);
      if(m[3])d.setFullYear(Number(m[3].length===2?"20"+m[3]:m[3]));
    }
  }
  return d.toISOString().slice(0,10);
}

function parseTime(text){
  const m=text.match(/(\d{1,2})(?:h|:)?(\d{2})?/i);
  if(!m)return "";
  return String(m[1]).padStart(2,"0")+":"+(m[2]||"00");
}

function downloadBlob(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* =========================================================
   WAKE WORD
   =========================================================
   IMPORTANT :
   Le navigateur mobile peut suspendre la reconnaissance vocale
   lorsqu'elle est en arrière-plan. On ne présente donc pas cette
   fonction comme une écoute permanente garantie.
   ========================================================= */

let wakeRecognition=null;
let wakeListening=false;

function startWakeWord(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;

  try{
    if(wakeRecognition)wakeRecognition.stop();
  }catch(e){}

  wakeRecognition=new SR();
  wakeRecognition.lang="fr-FR";
  wakeRecognition.continuous=true;
  wakeRecognition.interimResults=false;

  wakeRecognition.onresult=e=>{
    const result=e.results[e.results.length-1];
    if(!result||!result[0])return;
    const text=result[0].transcript.trim();
    const lower=text.toLowerCase();

    if(lower.includes("ok maryse")||lower.includes("okay maryse")){
      const demande=text.replace(/ok\s*maryse/ig,"").replace(/okay\s*maryse/ig,"").trim();
      if(demande)voiceAsk(demande);
      else{
        maryse("Oui, je vous écoute.");
      }
    }
  };

  wakeRecognition.onend=()=>{
    wakeRecognition=null;
    wakeListening=false;
    /* Ne relance pas indéfiniment en arrière-plan :
       le navigateur doit rester dans un contexte autorisé. */
  };

  try{
    wakeListening=true;
    wakeRecognition.start();
  }catch(e){
    wakeRecognition=null;
    wakeListening=false;
  }
}
