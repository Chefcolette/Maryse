<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#71856f"><link rel="manifest" href="./manifest.webmanifest"><title>MARYSE — Le copilote des métiers de bouche</title><style>

</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">MARYSE</div><div class="tag">Le copilote des métiers de bouche</div></div><div class="company"><span class="muted">Société</span><select id="co" onchange="company=this.value;save();render()"></select><button class="btn" onclick="addCompany()">+ Société</button></div></div></header>

<div id="modal" class="modal"><div id="dialog" class="dialog"></div></div>
<script>
const K="maryse61";let D=JSON.parse(localStorage.getItem(K)||"null"),company="",page="home",edit=null,ctx=null,rec=null,active=false;
const fresh=()=>{let c=crypto.randomUUID();return{v:61,company:c,companies:[{id:c,name:"Chez Colette"}],clients:[],suppliers:[],recipes:[],stock:[],purchases:[],events:[],employees:[]}};
if(!D||D.v!==61)D=fresh();company=D.company;function save(){D.company=company;localStorage.setItem(K,JSON.stringify(D))}function A(k){return D[k].filter(x=>x.c===company)}function id(){return crypto.randomUUID()}function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(x){return Number(x||0).toLocaleString("fr-FR",{minimumFractionDigits:2})+" €"}function go(x){page=x;render()}
const N=[["home","⌂ Accueil"],["clients","👥 Clients"],["suppliers","🚚 Fournisseurs"],["recipes","🍽️ Recettes"],["stock","📦 Stock & inventaire"],["purchases","🧾 Achats"],["planning","📅 Planning"],["personnel","👤 Personnel / RH"],["gestion","📊 Gestion"],["voice","🎙️ Conversation MARYSE"],["legal","⚖️ À propos & légal"]];

function head(a,b,buttons=""){main.innerHTML=`<div class="head"><div><h1>${a}</h1><div class="muted">${b}</div></div><div class="actions">${buttons}</div></div>`}function card(a,b){main.innerHTML+=`<section class="card"><h2>${a}</h2>${b}</section>`}
function home(){let ca=A("events").reduce((s,x)=>s+ +x.revenue||0,0),pu=A("purchases").reduce((s,x)=>s+ +x.total||0,0);head("Bonjour, bienvenue dans MARYSE","Votre cockpit — "+esc(D.companies.find(x=>x.id===company).name));let q=[["CA prestations",money(ca)],["Achats",money(pu)],["Clients",A("clients").length],["Stock",A("stock").length],["Recettes",A("recipes").length],["Événements",A("events").length],["Personnel",A("employees").length],["Fournisseurs",A("suppliers").length]];main.innerHTML+=`<div class="grid">${q.map(x=>`<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("")}</div>`;card("Démarrage rapide",`<div class="actions"><button class="btn primary" onclick="openClient()">+ Client</button><button class="btn primary" onclick="openSupplier()">+ Fournisseur</button><button class="btn primary" onclick="openRecipe()">+ Recette</button><button class="btn accent" onclick="go('voice')">🎙️ Parler à MARYSE</button></div>`);card("Socle V6.1","Multi-sociétés, clients, fournisseurs, recettes, stock/inventaire, achats, planning, personnel/RH, gestion et conversation guidée sont inclus.");}
function table(title,sub,k,add,heads,rows){head(title,sub,`<button class="btn primary" onclick="${add}">+ Nouveau</button>`);main.innerHTML+=`<section class="card">${rows?`<table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">Aucune donnée enregistrée.</div>`}</section>`}
function clients(){let a=A("clients");table("Clients","Fiches clients","clients","openClient()",["Nom","Téléphone","E-mail","Ville",""],a.map(x=>`<tr><td><b>${esc(x.name)}</b> ${esc(x.first)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.city)}</td><td><button class="btn" onclick="openClient('${x.id}')">Modifier</button></td></tr>`).join(""))}
function suppliers(){let a=A("suppliers");table("Fournisseurs","Contacts, catalogues, produits et références","suppliers","openSupplier()",["Fournisseur","Contact","Téléphone","Produits / références",""],a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td>${esc(x.phone)}</td><td>${esc(x.products)}</td><td><button class="btn" onclick="openSupplier('${x.id}')">Modifier</button></td></tr>`).join(""))}
function recipes(){let a=A("recipes");table("Recettes","Fiches techniques, coût, matériel et allergènes","recipes","openRecipe()",["Recette","Portions","Coût","Allergènes",""],a.map(x=>`<tr><td><b>${esc(x.name)}</b><br>${esc(x.ingredients)}</td><td>${esc(x.portions)}</td><td>${money(x.cost)}</td><td>${esc(x.allergens)}</td><td><button class="btn" onclick="openRecipe('${x.id}')">Modifier</button></td></tr>`).join(""))}
function stock(){let a=A("stock");head("Stock & inventaire","Stock théorique/réel, écarts, pertes, casse et lots",`<button class="btn primary" onclick="openStock()">+ Article</button><button class="btn accent" onclick="scan()">📷 Scanner</button>`);card("Scan","Le navigateur utilise BarcodeDetector lorsqu'il est disponible. L'OCR et les douchettes USB/Bluetooth sont prévus pour les connecteurs de la version connectée.");main.innerHTML+=`<section class="card">${a.length?`<table><tr><th>Article</th><th>Unité</th><th>Théorique</th><th>Réel</th><th>Écart</th><th>Lot/DLC</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.name)}<br>${esc(x.code)}</td><td>${esc(x.unit)}</td><td>${x.theo}</td><td>${x.real??"—"}</td><td><span class="badge">${x.real==null?"—":(+x.real-+x.theo).toFixed(2)}</span></td><td>${esc(x.lot)}<br>${esc(x.expiry)}</td><td><button class="btn" onclick="openStock('${x.id}')">Modifier</button></td></tr>`).join("")}</table>`:`<div class="empty">Aucun article.</div>`}</section>`}
function purchases(){let a=A("purchases");table("Achats","Suivi des achats et des lots","purchases","openPurchase()",["Date","Fournisseur","Article","Qté","Total",""],a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.supplier)}</td><td>${esc(x.item)}</td><td>${esc(x.qty)}</td><td>${money(x.total)}</td><td><button class="btn" onclick="openPurchase('${x.id}')">Modifier</button></td></tr>`).join(""))}
function planning(){let a=A("events");table("Planning","Prestations, livraisons, rappels et priorités","events","openEvent()",["Date","Événement","Type","Priorité","Client","CA",""],a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td><span class="badge">${esc(x.priority)}</span></td><td>${esc(x.client)}</td><td>${money(x.revenue)}</td><td><button class="btn" onclick="openEvent('${x.id}')">Modifier</button></td></tr>`).join(""))}
function personnel(){let a=A("employees");head("Personnel / RH","Fiches salariés, horaires et coût de main-d'œuvre",`<button class="btn primary" onclick="openEmployee()">+ Salarié</button>`);main.innerHTML+=`<section class="card">${a.length?`<table><tr><th>Salarié</th><th>Fonction</th><th>Contrat</th><th>Coût horaire</th><th>Heures</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${esc(x.contract)}</td><td>${money(x.hourly)}</td><td>${(+x.hours||0).toFixed(2)}</td><td><button class="btn" onclick="clock('${x.id}')">${x.clocked?"⏹ Fin":"▶ Début"}</button> <button class="btn" onclick="openEmployee('${x.id}')">Modifier</button></td></tr>`).join("")}</table>`:`<div class="empty">Aucun salarié.</div>`}</section>`;card("RH","Les congés, absences, heures supplémentaires et règles conventionnelles doivent être adaptés au cadre social de l'entreprise.");}
function gestion(){let ca=A("events").reduce((s,x)=>s+(+x.revenue||0),0),pu=A("purchases").reduce((s,x)=>s+(+x.total||0),0),rh=A("employees").reduce((s,x)=>s+(+x.hourly||0)*(+x.hours||0),0);head("Gestion","Vision synthétique");main.innerHTML+=`<div class="grid">${[["CA",money(ca)],["Achats",money(pu)],["Main-d'œuvre",money(rh)],["Marge simplifiée",money(ca-pu-rh)]].map(x=>`<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("")}</div>`}
function voice(){head("Conversation MARYSE","Dialogue guidé : demande → questions → récapitulatif → confirmation");main.innerHTML+=`<section class="voice"><button id="orb" class="orb ${active?"live":""}" onclick="toggleVoice()">🎙️</button><p id="state">${active?"Je vous écoute…":"Appuyez sur le micro pour commencer."}</p><div class="actions"><button class="btn primary" onclick="toggleVoice()">${active?"⏹ Arrêter":"🎙️ Démarrer"}</button><button class="btn" onclick="log.innerHTML=''">Effacer</button></div><div class="actions" style="margin-top:10px"><input id="typed" placeholder="Ou écrivez votre demande…" onkeydown="if(event.key==='Enter')send()"><button class="btn accent" onclick="send()">Envoyer</button></div><div id="log"></div></section>`}
function legal(){head("À propos & informations légales","Socle documentaire de MARYSE");card("MARYSE","<p><b>MARYSE — Le copilote des métiers de bouche</b></p><p>Créé par <b>Sébastien Zevaco</b>. V6.1.</p>");card("Propriété intellectuelle","<p>Le logiciel, son code source, son interface, sa documentation et ses éléments graphiques sont protégés par les règles applicables. Toute reproduction, extraction ou exploitation non autorisée est interdite sous réserve de la loi et des contrats.</p>");card("RGPD","<p>La version commerciale devra préciser finalités, durées, droits, sous-traitants, sécurité et modalités d'exercice des droits.</p>");card("MARYSE Intelligence","<p>L'assistant aide à saisir, structurer et rechercher. Il ne modifie pas le code ou les règles de sécurité de sa propre initiative.</p>");}
function open(t,b){dialog.innerHTML=`<div style="display:flex;justify-content:space-between"><h2>${t}</h2><button class="btn" onclick="closeM()">✕</button></div>${b}`;modal.classList.add("open")}function closeM(){modal.classList.remove("open");edit=null}function F(l,i,v="",ty="text"){return`<div class="field"><label>${l}</label><input id="${i}" type="${ty}" value="${esc(v)}"></div>`}function up(k,o){if(edit){let i=D[k].findIndex(x=>x.id===edit);D[k][i]={...D[k][i],...o}}else D[k].push({...o,id:id(),c:company});save()}
function openClient(i=""){let x=i?D.clients.find(a=>a.id===i):{};edit=i;open("Client",`<div class="form">${F("Nom","n",x.name)}${F("Prénom","p",x.first)}${F("Téléphone","ph",x.phone)}${F("E-mail","em",x.email)}${F("Ville","vi",x.city)}</div><button class="btn primary" onclick="up('clients',{name:n.value,first:p.value,phone:ph.value,email:em.value,city:vi.value});closeM();render()">Enregistrer</button>`)}
function openSupplier(i=""){let x=i?D.suppliers.find(a=>a.id===i):{};edit=i;open("Fournisseur",`<div class="form">${F("Nom","n",x.name)}${F("Contact","ct",x.contact)}${F("Téléphone","ph",x.phone)}${F("E-mail","em",x.email)}<div class="field full"><label>Produits / références</label><textarea id="pr">${esc(x.products)}</textarea></div></div><button class="btn primary" onclick="up('suppliers',{name:n.value,contact:ct.value,phone:ph.value,email:em.value,products:pr.value});closeM();render()">Enregistrer</button>`)}
function openRecipe(i=""){let x=i?D.recipes.find(a=>a.id===i):{};edit=i;open("Recette",`<div class="form">${F("Nom","n",x.name)}${F("Portions","po",x.portions)}${F("Coût","co",x.cost)}${F("Allergènes","al",x.allergens)}<div class="field full"><label>Ingrédients</label><textarea id="ing">${esc(x.ingredients)}</textarea></div><div class="field full"><label>Matériel / préparation</label><textarea id="steps">${esc(x.steps)}</textarea></div></div><button class="btn primary" onclick="up('recipes',{name:n.value,portions:po.value,cost:co.value,allergens:al.value,ingredients:ing.value,steps:steps.value});closeM();render()">Enregistrer</button>`)}
function openStock(i=""){let x=i?D.stock.find(a=>a.id===i):{};edit=i;open("Stock",`<div class="form">${F("Article","n",x.name)}${F("Code","co",x.code)}${F("Unité","un",x.unit)}${F("Théorique","th",x.theo)}${F("Réel","re",x.real)}${F("Lot","lo",x.lot)}${F("DLC / DDM","ex",x.expiry,"date")}</div><button class="btn primary" onclick="up('stock',{name:n.value,code:co.value,unit:un.value,theo:th.value,real:re.value===''?null:re.value,lot:lo.value,expiry:ex.value});closeM();render()">Enregistrer</button>`)}
function openPurchase(i=""){let x=i?D.purchases.find(a=>a.id===i):{};edit=i;open("Achat",`<div class="form">${F("Fournisseur","su",x.supplier)}${F("Article","it",x.item)}${F("Quantité","qt",x.qty)}${F("Total","to",x.total)}${F("Lot","lo",x.lot)}${F("Date","da",x.date)}</div><button class="btn primary" onclick="up('purchases',{supplier:su.value,item:it.value,qty:qt.value,total:to.value,lot:lo.value,date:da.value});closeM();render()">Enregistrer</button>`)}
function openEvent(i=""){let x=i?D.events.find(a=>a.id===i):{};edit=i;open("Prestation",`<div class="form">${F("Nom","n",x.name)}${F("Date","da",x.date,"date")}${F("Client","cl",x.client)}${F("CA","re",x.revenue)}<div class="field"><label>Type</label><select id="ty"><option>Professionnel</option><option>Privé</option></select></div><div class="field"><label>Priorité</label><select id="pr"><option>Normale</option><option>Haute</option><option>Urgente</option></select></div></div><button class="btn primary" onclick="up('events',{name:n.value,date:da.value,client:cl.value,revenue:re.value,type:ty.value,priority:pr.value});closeM();render()">Enregistrer</button>`)}
function openEmployee(i=""){let x=i?D.employees.find(a=>a.id===i):{};edit=i;open("Personnel",`<div class="form">${F("Nom","n",x.name)}${F("Fonction","ro",x.role)}${F("Contrat","ct",x.contract)}${F("Coût horaire","ho",x.hourly)}${F("Heures","hr",x.hours)}</div><button class="btn primary" onclick="up('employees',{name:n.value,role:ro.value,contract:ct.value,hourly:ho.value,hours:hr.value,clocked:false});closeM();render()">Enregistrer</button>`)}
function clock(i){let x=D.employees.find(a=>a.id===i);if(!x.clocked){x.clocked=true;x.start=Date.now()}else{x.clocked=false;x.hours=(+x.hours||0)+(Date.now()-x.start)/36e5}save();render()}function addCompany(){let n=prompt("Nom de la société / établissement :");if(!n)return;let x=id();D.companies.push({id:x,name:n});company=x;save();render()}function scan(){alert("BarcodeDetector "+("BarcodeDetector"in window?"est disponible dans ce navigateur.":"n'est pas disponible ici.")+" L'OCR avancé sera relié dans la version connectée.")}
function send(){let e=document.getElementById("typed");if(e?.value.trim()){ask(e.value.trim());e.value=""}}function say(t){add("MARYSE",t);if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";let v=speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang)&&/female|femme|google|microsoft/i.test(x.name))||speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}}function add(w,t){let e=document.getElementById("log");if(e)e.innerHTML+=`<div class="bubble ${w==="Vous"?"me":"maryse"}"><small>${w}</small>${esc(t)}</div>`}
async function toggleVoice(){if(active){active=false;try{rec?.stop()}catch(e){}voice();return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert("Reconnaissance vocale indisponible. Utilisez Chrome.");try{let s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(x=>x.stop())}catch(e){return alert("Autorisez le microphone dans Chrome.")}active=true;voice();say("Oui, je vous écoute.");listen()}
function listen(){if(!active)return;let SR=window.SpeechRecognition||window.webkitSpeechRecognition;try{rec=new SR();rec.lang="fr-FR";rec.continuous=false;rec.interimResults=false;rec.onresult=e=>{let t=e.results[0][0].transcript;if(t)ask(t)};rec.onend=()=>{rec=null;if(active)setTimeout(listen,300)};rec.start()}catch(e){rec=null}}
function ask(raw){add("Vous",raw);let l=raw.toLowerCase();if(/stop|arrête/.test(l)){active=false;try{rec?.stop()}catch(e){}say("D'accord, j'arrête.");return}if(ctx){if(ctx.s==="confirm"){if(/^(oui|ok|confirme)/i.test(raw)){D[ctx.k].push({...ctx.d,id:id(),c:company});save();ctx=null;say("C'est enregistré.");return}if(/^(non|annule)/i.test(raw)){ctx=null;say("D'accord, je n'enregistre rien.");return}}if(ctx.s==="name"){ctx.d.name=raw;ctx.s="confirm";say(`J'ai noté ${raw}. Est-ce que j'enregistre ?`);return}}if(/client/.test(l)){ctx={k:"clients",d:{},s:"name"};say("Très bien. Quel est le nom du client ?");return}if(/fournisseur/.test(l)){ctx={k:"suppliers",d:{},s:"name"};say("Quel est le nom du fournisseur ?");return}if(/recette/.test(l)){ctx={k:"recipes",d:{},s:"name"};say("Quel est le nom de la recette ?");return}if(/stock|inventaire/.test(l)){go("stock");say("J'ouvre le stock.");return}if(/planning|prestation/.test(l)){go("planning");say("J'ouvre le planning.");return}if(/personnel|salarié|employé/.test(l)){go("personnel");say("J'ouvre le personnel.");return}say("Je peux gérer les clients, fournisseurs, recettes, stock, achats, planning et personnel. Que souhaitez-vous faire ?")}
modal.onclick=e=>{if(e.target===modal)closeM()};window.addEventListener("load",()=>{navigator.serviceWorker?.register("./sw.js");render()});
</script></body></html>
