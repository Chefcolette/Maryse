<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARYSE — Le copilote des métiers de bouche</title>
<style>
:root{--green:#173b31;--green2:#2d5b4d;--gold:#c28b38;--cream:#f5f3ed;--white:#fff;--ink:#1f2925;--muted:#6e7a75;--line:#dde4df;--red:#b64c46;--orange:#b77b29;--blue:#4a78a5;--shadow:0 8px 28px #183d3210;--r:16px}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:260px;background:var(--green);color:#fff;padding:18px 14px;overflow:auto}.logo{padding:7px 10px 18px;border-bottom:1px solid #ffffff1a;margin-bottom:14px}.logo strong{font-family:Georgia,serif;font-size:31px;letter-spacing:4px;color:#e3bf76}.logo small{display:block;color:#b9c9c2;margin-top:6px}.companybox{background:#244c40;border:1px solid #4d7064;border-radius:12px;padding:10px;margin-bottom:13px}.companybox label{font-size:9px;color:#b9c9c2;display:block;margin-bottom:5px}.companybox select{width:100%;padding:8px;border:0;border-radius:8px}.nav{display:grid;gap:3px}.nav button{width:100%;border:0;background:transparent;color:#dce5e1;text-align:left;padding:11px;border-radius:10px}.nav button:hover,.nav button.active{background:#2d5a4d;color:#fff}.nav .ai{color:#f0cd87}.support{margin-top:25px;padding:14px 10px;border-top:1px solid #ffffff20;color:#b9c9c2;font-size:11px}.main{margin-left:260px;padding:22px 28px 55px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:10px}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.danger{background:#fae8e5;color:var(--red);border-color:#f1cbc7}.btn.small{padding:6px 9px;font-size:11px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,var(--green),#3e6a5b);color:#fff;border:0}.hero p{color:#d9e5e0;line-height:1.55}.label{font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--muted);margin-bottom:6px}.hero .label{color:#d5e1dc}.value{font-size:25px;font-weight:850}.small{font-size:11px;color:var(--muted)}.section{font-size:17px;font-weight:800;margin:23px 0 10px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{background:#fff;border:1px solid var(--line);border-radius:14px;text-align:left;padding:14px}.quick b{display:block;margin:6px 0 3px}.quick span{font-size:11px;color:var(--muted)}.ico{font-size:24px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:8px;color:var(--muted);letter-spacing:.5px;white-space:nowrap}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf0ee;font-size:9px;font-weight:800}.ok{background:#e4f1e9;color:#39735a}.warn{background:#fff0d8;color:#a46d20}.bad{background:#fae8e5;color:var(--red)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.search{flex:1;min-width:220px;padding:10px;border:1px solid var(--line);border-radius:10px}.empty{text-align:center;padding:28px;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:9px;color:var(--muted);font-weight:800;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.modalbg{display:none;position:fixed;z-index:50;inset:0;background:#0e211dcc;padding:20px;overflow:auto}.modal{background:#fff;max-width:900px;margin:auto;border-radius:20px;padding:20px;box-shadow:0 25px 90px #0004}.modalhead{display:flex;justify-content:space-between;gap:15px}.close{border:0;border-radius:50%;width:32px;height:32px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{display:none;position:fixed;z-index:100;right:18px;bottom:18px;background:#202825;color:#fff;padding:12px 15px;border-radius:10px;font-size:12px}.kpi{display:flex;justify-content:space-between;gap:10px;align-items:end}.progress{height:7px;background:#edf0ee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.voicebox{border:2px solid #dbc99f;background:#fffaf0}.voice-log{min-height:160px;max-height:350px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;line-height:1.55}.voice-line{margin-bottom:10px}.voice-line b{color:var(--green)}.bigvoice{width:90px;height:90px;border-radius:50%;border:0;background:var(--gold);color:#fff;font-size:34px;box-shadow:0 10px 30px #c28b3840}.bigvoice.live{background:var(--red)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.checkline{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:11px}.checkline input{width:auto}.mutedbox{background:#f7f8f7;border:1px dashed var(--line);border-radius:12px;padding:12px}.eventcard{border-left:4px solid var(--green);padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px}.list{display:grid;gap:8px}.listrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.photo-preview img{max-width:180px;max-height:140px;border-radius:10px}.warning{background:#fff5e5;border:1px solid #ecd3a8;padding:10px;border-radius:10px;font-size:11px}.hide{display:none!important}
@media(max-width:1000px){.sidebar{width:76px;padding:14px 8px}.logo{text-align:center}.logo strong{font-size:21px;letter-spacing:1px}.logo small,.companybox,.nav span,.support{display:none}.nav button{text-align:center;font-size:20px}.main{margin-left:76px;padding:17px}.g4{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.top{display:block}.actions{margin-top:12px}.g2,.g3,.g4,.split,.form{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:12px}.quick{grid-template-columns:1fr}.modalbg{padding:8px}.modal{padding:15px}.sidebar{width:64px}.main{margin-left:64px}.value{font-size:21px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><strong>MARYSE</strong><small>Le copilote des métiers de bouche</small></div><div class="companybox"><label>SOCIÉTÉ ACTIVE</label><select id="companySelect" onchange="switchCompany(this.value)"></select></div><nav class="nav" id="nav"></nav><div class="support">Besoin d'aide ?<br><b>Demander à MARYSE</b></div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Bonjour 👋</h1><p id="pageSub">Votre activité, simplement.</p></div><div class="actions"><button class="btn" onclick="openClient()">+ Client</button><button class="btn" onclick="openRecipe()">+ Recette</button><button class="btn" onclick="openEvent()">+ Prestation</button><button class="btn gold" onclick="go('voice')">🎙️ MARYSE Voice</button></div></header><div id="pages"></div></main></div><div class="modalbg" id="modal"><div class="modal"><div class="modalhead"><div><div class="label" id="mlabel">MARYSE</div><h2 id="mtitle" style="margin:0">Action</h2><p class="small" id="msub"></p></div><button class="close" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='maryse_v7_data';
const NAV=[['home','⌂','Accueil','Votre tableau de bord opérationnel.'],['planning','▣','Planning','Prestations, livraisons, production et rappels.'],['clients','♙','Clients','Clients, contacts, historique et chiffre d’affaires.'],['suppliers','▤','Fournisseurs','Fiches fournisseurs, conditions et historique.'],['catalog','◈','Catalogue produits','Prix, conditionnements, références et codes.'],['recipes','◒','Recettes & fiches','Fiches techniques, coûts, photos et marges.'],['stock','📦','Stock & inventaire','Stock théorique, réel, écarts et pertes.'],['purchases','🛒','Achats','Besoins calculés et commandes préparées.'],['trace','📸','Scan & traçabilité','Réceptions, lots, DLC et anomalies.'],['manage','📊','Gestion & rentabilité','CA, coûts, marges et rentabilité.'],['ai','✦','MARYSE Intelligence','Analyse, propositions et aide à la décision.'],['voice','🎙️','MARYSE Voice','Mode conversationnel mains libres.'],['settings','⚙️','Société & réglages','Sociétés, métiers, export et remise à zéro.']];
const clone=o=>JSON.parse(JSON.stringify(o));
const defaultData={companies:[{id:'c1',name:'Ma société',legalName:'',siret:'',activity:'Traiteur',address:'',city:''}],activeCompany:'c1',clients:[],suppliers:[],products:[],recipes:[],events:[],inventory:[],purchases:[],receipts:[],feedback:[],settings:{currency:'EUR'}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||clone(defaultData);if(!db.companies?.length){db=clone(defaultData)};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(v){return String(v??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}function n(v){return Number(v)||0}function euro(v){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n(v))}function companyItems(k){return (db[k]||[]).filter(x=>x.companyId===db.activeCompany)}function company(){return db.companies.find(x=>x.id===db.activeCompany)||db.companies[0]}
function init(){document.getElementById('nav').innerHTML=NAV.map((x,i)=>`<button data-page="${x[0]}" onclick="go('${x[0]}')">${x[1]} <span>${x[2]}</span></button>`).join('');document.getElementById('companySelect').innerHTML=db.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');document.getElementById('companySelect').value=db.activeCompany;renderAll();go('home')}
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const el=document.getElementById('p-'+id);if(el)el.classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));const meta=NAV.find(x=>x[0]===id)||NAV[0];document.getElementById('pageTitle').textContent=id==='home'?'Bonjour 👋':meta[2];document.getElementById('pageSub').textContent=id==='home'?'Votre activité, simplement.':meta[3];if(id==='voice')renderVoice();if(id==='home')renderHome()}
function switchCompany(id){db.activeCompany=id;save();document.getElementById('companySelect').value=id;renderAll();go('home');toast('Société active : '+company().name)}
function shell(id,html){return `<section class="page" id="p-${id}">${html}</section>`}
function renderAll(){document.getElementById('pages').innerHTML=[home(),planning(),clients(),suppliers(),catalog(),recipes(),stock(),purchases(),trace(),manage(),ai(),voice(),settings()].join('');renderVoice()}
function home(){const ev=companyItems('events').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4), inv=companyItems('inventory'), low=inv.filter(i=>n(i.real)<n(i.threshold)), rec=companyItems('recipes');const ca=ev.reduce((s,x)=>s+n(x.amount),0), achats=companyItems('purchases').reduce((s,x)=>s+n(x.total),0);return shell('home',`<div class="grid g4"><div class="card"><div class="label">CA DES PRESTATIONS ENREGISTRÉES</div><div class="value">${euro(ca)}</div><div class="small">Basé sur vos prestations saisies</div></div><div class="card"><div class="label">ACHATS ENREGISTRÉS</div><div class="value">${euro(achats)}</div><div class="small">Historique de cette société</div></div><div class="card"><div class="label">ALERTES STOCK</div><div class="value ${low.length?'':'green'}">${low.length}</div><div class="small">Produits sous seuil</div></div><div class="card"><div class="label">ÉVÉNEMENTS À VENIR</div><div class="value">${ev.length}</div><div class="small">Dans votre planning</div></div></div><div class="section">Que voulez-vous faire ?</div><div class="quick"><button onclick="openEvent()"><div class="ico">📅</div><b>Créer une prestation</b><span>Client, date, menu, montant, équipe.</span></button><button onclick="openRecipe()"><div class="ico">🍽️</div><b>Créer une recette</b><span>Ingrédients, coût, prix, marge et photo.</span></button><button onclick="openInventory()"><div class="ico">📦</div><b>Faire mon inventaire</b><span>Compter et enregistrer les écarts.</span></button><button onclick="go('purchases')"><div class="ico">🛒</div><b>Que dois-je commander ?</b><span>MARYSE calcule les besoins.</span></button><button onclick="openClient()"><div class="ico">👥</div><b>Créer un client</b><span>Coordonnées et historique.</span></button><button onclick="openSupplier()"><div class="ico">🚚</div><b>Ajouter un fournisseur</b><span>Conditions et produits.</span></button><button onclick="openProduct()"><div class="ico">🏷️</div><b>Ajouter un produit</b><span>Prix, code, conditionnement.</span></button><button onclick="go('voice')"><div class="ico">🎙️</div><b>Parler à MARYSE</b><span>Utilisation mains libres.</span></button></div><div class="section">Votre journée</div><div class="grid split"><div class="card"><div class="toolbar"><b>Prochaines prestations</b><button class="btn small" onclick="go('planning')">Voir tout</button></div><div class="list">${ev.length?ev.map(e=>`<div class="eventcard"><div class="kpi"><div><b>${esc(e.name)}</b><div class="small">${esc(e.date)} · ${esc(e.clientName||'Sans client')} · ${e.volume||0} personnes</div></div><b>${euro(e.amount)}</b></div></div>`).join(''):'<div class="empty">Aucune prestation. Créez votre première prestation.</div>'}</div></div><div class="card hero"><div class="label">MARYSE INTELLIGENCE</div><h2>Votre copilote, pas un menu de plus.</h2><p>Dites ce que vous voulez faire. MARYSE vous guide, calcule, prépare et demande confirmation avant les actions sensibles.</p><button class="btn gold" onclick="go('voice')">🎙️ Commencer une conversation</button></div></div><div class="section">Alertes utiles</div><div class="grid g3"><div class="card"><b>${low.length?'⚠️':'✓'} Stock</b><p class="small">${low.length?low.map(i=>`${esc(i.name)} : ${n(i.real)} ${esc(i.unit)} / seuil ${n(i.threshold)}`).join('<br>'):'Aucun produit sous seuil.'}</p></div><div class="card"><b>📋 Recettes</b><p class="small">${rec.length} fiche(s) dans votre société. Les coûts sont recalculés depuis les produits lorsque les ingrédients sont renseignés.</p></div><div class="card"><b>🔐 Données</b><p class="small">Vos données de test sont conservées dans ce navigateur. Exportez-les depuis Société & réglages.</p></div></div>`)}
function clients(){const a=companyItems('clients');return shell('clients',`<div class="toolbar"><div><h2 style="margin:0">Clients</h2><div class="small">Une fiche client reliée aux prestations et au chiffre d’affaires.</div></div><button class="btn primary" onclick="openClient()">+ Nouveau client</button></div><div class="card"><input class="search" placeholder="Rechercher un client…" oninput="filterTable('clientsTable',this.value)"><div class="tablewrap"><table class="table" id="clientsTable"><thead><tr><th>CLIENT</th><th>TYPE</th><th>CONTACT</th><th>VILLE</th><th>CA</th><th>ACTION</th></tr></thead><tbody>${a.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="small">${esc(c.notes||'')}</div></td><td>${esc(c.type)}</td><td>${esc(c.phone||'')}<br>${esc(c.email||'')}</td><td>${esc(c.city||'')}</td><td>${euro(caClient(c.id))}</td><td><button class="btn small" onclick="openClient('${c.id}')">Modifier</button> <button class="btn small danger" onclick="del('clients','${c.id}','client')">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Aucun client.</div></td></tr>'}</tbody></table></div></div>`)}
function caClient(id){return companyItems('events').filter(e=>e.clientId===id).reduce((s,e)=>s+n(e.amount),0)}
function suppliers(){const a=companyItems('suppliers');return shell('suppliers',`<div class="toolbar"><div><h2 style="margin:0">Fournisseurs</h2><div class="small">Coordonnées, conditions, produits et historique.</div></div><button class="btn primary" onclick="openSupplier()">+ Nouveau fournisseur</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>FOURNISSEUR</th><th>CONTACT</th><th>CONDITIONS</th><th>PRODUITS</th><th>ACTIONS</th></tr></thead><tbody>${a.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="small">${esc(s.city||'')}</div></td><td>${esc(s.contact||'')}<br>${esc(s.phone||'')}<br>${esc(s.email||'')}</td><td>${esc(s.paymentTerms||'')}<br>${esc(s.delivery||'')}</td><td>${companyItems('products').filter(p=>p.supplierId===s.id).length}</td><td><button class="btn small" onclick="openSupplier('${s.id}')">Modifier</button> <button class="btn small danger" onclick="del('suppliers','${s.id}','fournisseur')">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Aucun fournisseur.</div></td></tr>'}</tbody></table></div>`)}
function catalog(){const a=companyItems('products');return shell('catalog',`<div class="toolbar"><div><h2 style="margin:0">Catalogue produits</h2><div class="small">Une seule référence alimente achats, recettes, stock et marges.</div></div><button class="btn primary" onclick="openProduct()">+ Nouveau produit</button></div><div class="card"><input class="search" placeholder="Nom, code-barres, référence…" oninput="filterTable('productsTable',this.value)"><div class="tablewrap"><table class="table" id="productsTable"><thead><tr><th>PRODUIT</th><th>UNITÉ</th><th>CONDITIONNEMENT</th><th>PRIX HT</th><th>FOURNISSEUR</th><th>CODES</th><th>STOCK</th><th>ACTIONS</th></tr></thead><tbody>${a.map(p=>{const s=db.suppliers.find(x=>x.id===p.supplierId);const i=companyItems('inventory').find(x=>x.productId===p.id);return `<tr><td><b>${esc(p.name)}</b><div class="small">${esc(p.category||'')}</div></td><td>${esc(p.unit)}</td><td>${esc(p.packaging||'—')}</td><td>${euro(p.priceHT)}</td><td>${esc(s?.name||'—')}</td><td>${esc(p.internalRef||'')}<br><span class="small">EAN ${esc(p.barcode||'—')} · Réf ${esc(p.supplierRef||'—')}</span></td><td>${i?`${n(i.real)} ${esc(i.unit)}`:'—'}</td><td><button class="btn small" onclick="openProduct('${p.id}')">Modifier</button></td></tr>`}).join('')||'<tr><td colspan="8"><div class="empty">Aucun produit.</div></td></tr>'}</tbody></table></div></div>`)}
function recipes(){const a=companyItems('recipes');return shell('recipes',`<div class="toolbar"><div><h2 style="margin:0">Recettes & fiches techniques</h2><div class="small">Le coût est calculé à partir du catalogue produits.</div></div><button class="btn primary" onclick="openRecipe()">+ Nouvelle recette</button></div><div class="grid g3">${a.map(r=>`<div class="card"><div class="row"><span class="badge ${r.sale&&r.cost&&r.sale>r.cost?'ok':''}">${r.sale&&r.cost?'Marge '+((1-r.cost/r.sale)*100).toFixed(1)+' %':'À compléter'}</span><button class="btn small" onclick="openRecipe('${r.id}')">Modifier</button></div>${r.photo?`<img src="${r.photo}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-top:9px">`:''}<h3>${esc(r.name)}</h3><div class="small">${n(r.yield)||0} portions · coût ${euro(r.cost)} · vente ${euro(r.sale)}</div><p class="small">${esc(r.presentation||r.notes||'')}</p></div>`).join('')||'<div class="card empty">Aucune recette. Créez votre première fiche technique.</div>'}</div>`)}
function stock(){const a=companyItems('inventory');return shell('stock',`<div class="toolbar"><div><h2 style="margin:0">Stock & inventaire</h2><div class="small">Théorique, réel, écarts, seuils et pertes.</div></div><button class="btn primary" onclick="openInventory()">✓ Faire mon inventaire</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>PRODUIT</th><th>THÉORIQUE</th><th>RÉEL</th><th>ÉCART</th><th>SEUIL</th><th>ÉTAT</th><th>ACTION</th></tr></thead><tbody>${a.map(i=>{const diff=n(i.real)-n(i.theoretical),low=n(i.real)<n(i.threshold);return `<tr><td><b>${esc(i.name)}</b></td><td>${n(i.theoretical)} ${esc(i.unit)}</td><td>${n(i.real)} ${esc(i.unit)}</td><td class="${diff<0?'red':''}">${diff>0?'+':''}${diff.toFixed(2)}</td><td>${n(i.threshold)} ${esc(i.unit)}</td><td><span class="badge ${low?'bad':'ok'}">${low?'À commander':'OK'}</span></td><td><button class="btn small" onclick="quickStock('${i.id}')">Modifier</button></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">Votre stock est vide. Ajoutez des produits au catalogue.</div></td></tr>'}</tbody></table></div><div class="section">Logique MARYSE</div><div class="card"><b>Vente → consommation → stock → seuil → besoin d'achat</b><p class="small">Dans cette version de test, vous pouvez déjà enregistrer le stock réel et les achats. La liaison POS sera branchée dans l'architecture SaaS.</p></div>`)}
function purchases(){const inv=companyItems('inventory'), needs=inv.filter(i=>n(i.real)<n(i.threshold)).map(i=>{const p=companyItems('products').find(p=>p.id===i.productId);const qty=Math.max(0,n(i.threshold)-n(i.real));return {...i,need:qty,product:p}});return shell('purchases',`<div class="toolbar"><div><h2 style="margin:0">Achats</h2><div class="small">MARYSE calcule les besoins à partir du stock et des seuils.</div></div><button class="btn primary" onclick="preparePurchase()">Créer la proposition d'achat</button></div><div class="grid g2"><div class="card"><h3>À commander maintenant</h3>${needs.length?`<div class="list">${needs.map(x=>{const s=db.suppliers.find(s=>s.id===x.product?.supplierId);return `<div class="listrow"><span><b>${esc(x.name)}</b><br><span class="small">${esc(s?.name||'Fournisseur à définir')}</span></span><b>${x.need.toFixed(2)} ${esc(x.unit)}</b></div>`}).join('')}</div>`:'<div class="empty">Aucun besoin détecté avec les seuils actuels.</div>'}</div><div class="card"><h3>Historique des achats</h3><div class="list">${companyItems('purchases').slice().reverse().slice(0,8).map(p=>`<div class="listrow"><span>${esc(p.label)}<br><span class="small">${esc(p.supplier||'')} · ${esc(p.date||'')}</span></span><b>${euro(p.total)}</b></div>`).join('')||'<div class="empty">Aucun achat enregistré.</div>'}</div></div></div><div class="section">Commande fournisseur</div><div id="purchaseProposal" class="card mutedbox">Cliquez sur « Créer la proposition » pour générer un brouillon par fournisseur.</div>`)}
function trace(){const a=companyItems('receipts');return shell('trace',`<div class="toolbar"><div><h2 style="margin:0">Scan & traçabilité</h2><div class="small">Réception, lot, DLC, quantité, photo et anomalie.</div></div><button class="btn primary" onclick="openReceipt()">+ Enregistrer une réception</button></div><div class="grid g2"><div class="card hero"><div class="label">RÉCEPTION</div><h2>📸 Photo → validation → traçabilité</h2><p>La photo originale est conservée. Les informations sont saisies ou reconnues dans la future version IA, puis validées par vous.</p><button class="btn gold" onclick="openReceipt()">Tester une réception</button></div><div class="card"><h3>Réceptions récentes</h3>${a.slice().reverse().slice(0,5).map(r=>`<div class="listrow"><span><b>${esc(r.product)}</b><br><span class="small">Lot ${esc(r.lot||'—')} · DLC ${esc(r.dlc||'—')}</span></span><span class="badge ${r.anomaly?'bad':'ok'}">${r.anomaly?'Anomalie':'Conforme'}</span></div>`).join('')||'<div class="empty">Aucune réception.</div>'}</div></div>`)}
function manage(){const ev=companyItems('events'),p=companyItems('purchases'),ca=ev.reduce((s,x)=>s+n(x.amount),0),ach=p.reduce((s,x)=>s+n(x.total),0),res=ca-ach;return shell('manage',`<h2>Gestion & rentabilité</h2><p class="small">Les chiffres se construisent à partir de vos données saisies.</p><div class="grid g4" style="margin-top:15px"><div class="card"><div class="label">CA</div><div class="value">${euro(ca)}</div></div><div class="card"><div class="label">ACHATS</div><div class="value">${euro(ach)}</div></div><div class="card"><div class="label">RÉSULTAT SIMPLIFIÉ</div><div class="value ${res>=0?'green':'red'}">${euro(res)}</div></div><div class="card"><div class="label">MARGE APRÈS ACHATS</div><div class="value">${ca?(res/ca*100).toFixed(1):0}%</div></div></div><div class="section">Rentabilité des prestations</div><div class="card tablewrap"><table class="table"><thead><tr><th>PRESTATION</th><th>CA</th><th>ACHATS AFFECTÉS</th><th>MARGE SIMPLIFIÉE</th></tr></thead><tbody>${ev.map(e=>{const costs=companyItems('purchases').filter(p=>p.eventId===e.id).reduce((s,p)=>s+n(p.total),0),m=n(e.amount)-costs;return `<tr><td><b>${esc(e.name)}</b><div class="small">${esc(e.date)}</div></td><td>${euro(e.amount)}</td><td>${euro(costs)}</td><td>${euro(m)} (${e.amount?((m/e.amount)*100).toFixed(1):0}%)</td></tr>`}).join('')||'<tr><td colspan="4"><div class="empty">Créez une prestation pour voir sa rentabilité.</div></td></tr>'}</tbody></table></div><div class="section">À compléter dans la version SaaS</div><div class="grid g3"><div class="card"><b>Personnel</b><p class="small">Coût par prestation et temps réellement travaillé.</p></div><div class="card"><b>Transport</b><p class="small">Kilométrage, véhicule, carburant et frais.</p></div><div class="card"><b>Charges fixes</b><p class="small">Loyer, énergie, assurances et autres charges.</p></div></div>`)}
function ai(){return shell('ai',`<div class="card voicebox"><div class="label">MARYSE INTELLIGENCE</div><h2>Demandez ce que vous voulez savoir</h2><p class="small">Cette version travaille sur vos données locales et explique ses calculs. Les actions sensibles demandent confirmation.</p><textarea id="aiQ" placeholder="Ex. Que dois-je commander cette semaine ?"></textarea><button class="btn primary" onclick="askAI()">Analyser avec MARYSE</button><div id="aiR" class="mutedbox hide" style="margin-top:12px"></div></div><div class="section">Questions utiles</div><div class="grid g3"><button class="card" onclick="setAI('Que dois-je commander ?')"><b>🛒 Que dois-je commander ?</b><p class="small">Stock + seuils + produits.</p></button><button class="card" onclick="setAI('Quelle est ma rentabilité ?')"><b>📊 Quelle est ma rentabilité ?</b><p class="small">CA et achats enregistrés.</p></button><button class="card" onclick="setAI('Qu’est-ce que je dois faire aujourd’hui ?')"><b>📅 Que dois-je faire aujourd’hui ?</b><p class="small">Planning et alertes.</p></button></div>`)}
function voice(){return shell('voice',`<div class="card voicebox"><div class="label">MARYSE VOICE · VÉRIFICATION</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0 0 5px">🎙️ Parlez à MARYSE</h2><p class="small" style="margin:0">MARYSE vérifie d’abord que votre téléphone autorise l’accès au microphone.</p></div><button class="btn primary" onclick="checkMicrophone(true)">🔎 Tester le microphone</button></div><div id="micStatus" class="mutedbox" style="margin-top:14px"><b>Microphone : vérification nécessaire</b><div class="small">Appuyez sur « Tester le microphone ». Si Android affiche une demande, choisissez « Autoriser ».</div></div></div><div class="grid split" style="margin-top:14px"><div class="card hero"><div class="label">MODE MAINS LIBRES</div><h2>🎙️ Conversation avec MARYSE</h2><p>Parlez naturellement. Vous pouvez interrompre, corriger et demander à MARYSE de vous guider. Les actions sensibles demandent une confirmation.</p><div style="display:flex;align-items:center;gap:18px;margin-top:18px"><button id="voiceBtn" class="bigvoice" onclick="toggleVoice()" disabled>🎙️</button><div><b id="voiceState">Micro non testé</b><div class="small" style="color:#dce6e1">Le bouton devient actif lorsque le microphone est autorisé.</div></div></div></div><div class="card"><h3>Comment ça marche ?</h3><div class="checkline">1. <span>Testez le microphone.</span></div><div class="checkline">2. <span>Autorisez le microphone si Android le demande.</span></div><div class="checkline">3. <span>Appuyez sur le bouton 🎙️ et parlez.</span></div><div class="checkline">4. <span>MARYSE retranscrit votre demande et vous répond.</span></div><div class="toolbar"><button class="btn" onclick="voiceAsk('Crée une recette')">« Crée une recette »</button><button class="btn" onclick="voiceAsk('Ajoute un fournisseur')">« Ajoute un fournisseur »</button></div></div></div><div class="section">Conversation</div><div class="card"><div id="voiceLog" class="voice-log">MARYSE : Bonjour. Je suis prête. Testez d’abord le microphone, puis dites-moi simplement ce que vous voulez faire.</div><div class="toolbar"><input id="voiceText" class="search" placeholder="Vous pouvez aussi écrire votre demande…" onkeydown="if(event.key==='Enter')voiceAsk(this.value)"><button class="btn primary" onclick="voiceAsk(document.getElementById('voiceText').value)">Envoyer</button></div></div><div class="warning"><b>Si le micro reste bloqué :</b> dans Chrome, ouvrez les informations du site → <b>Autorisations</b> → <b>Microphone → Autoriser</b>. Vérifiez aussi dans Android : Paramètres → Applications → Chrome → Autorisations → Microphone.</div>`)}
function settings(){return shell('settings',`<div class="grid g2"><div class="card"><h2>Sociétés</h2><p class="small">Séparez les activités et établissements.</p><div class="list">${db.companies.map(c=>`<div class="listrow"><span><b>${esc(c.name)}</b><br><span class="small">${esc(c.activity||'')}</span></span><button class="btn small" onclick="openCompany('${c.id}')">Modifier</button></div>`).join('')}</div><button class="btn primary" style="margin-top:10px" onclick="openCompany()">+ Nouvelle société</button></div><div class="card"><h2>Données</h2><p class="small">Tout est enregistré localement dans ce navigateur pour le test.</p><div class="toolbar"><button class="btn" onclick="exportData()">⬇ Exporter mes données</button><button class="btn" onclick="importData()">⬆ Importer</button><input id="importFile" type="file" accept="application/json" class="hide" onchange="doImport(this)"></div><div class="warning">Pour un usage professionnel réel, il faudra ensuite une base serveur sécurisée, comptes utilisateurs, sauvegardes, synchronisation multi-appareils, droits et journal d’audit.</div></div><div class="card"><h2>Réinitialiser le test</h2><p class="small">Supprime toutes les données locales de MARYSE V7 dans ce navigateur.</p><button class="btn danger" onclick="resetData()">Réinitialiser MARYSE</button></div></div>`)}
function planning(){const a=companyItems('events').sort((x,y)=>x.date.localeCompare(y.date));return shell('planning',`<div class="toolbar"><div><h2 style="margin:0">Planning</h2><div class="small">Prestations, livraisons et production.</div></div><button class="btn primary" onclick="openEvent()">+ Nouvelle prestation</button></div><div class="grid g2">${a.map(e=>`<div class="card"><div class="kpi"><div><span class="badge ${e.priority==='Haute'?'bad':e.priority==='Normale'?'warn':'ok'}">${esc(e.priority)}</span><h3>${esc(e.name)}</h3><div class="small">${esc(e.date)} · ${esc(e.type)} · ${n(e.volume)} personnes</div><div class="small">Client : ${esc(e.clientName||'—')} · ${esc(e.city||'')}</div></div><b>${euro(e.amount)}</b></div><div class="toolbar"><button class="btn small" onclick="openEvent('${e.id}')">Modifier</button><button class="btn small danger" onclick="del('events','${e.id}','prestation')">Supprimer</button></div></div>`).join('')||'<div class="card empty">Aucune prestation.</div>'}</div>`)}
function openModal(label,title,sub,body){document.getElementById('mlabel').textContent=label;document.getElementById('mtitle').textContent=title;document.getElementById('msub').textContent=sub||'';document.getElementById('mbody').innerHTML=body;document.getElementById('modal').style.display='block'}function closeModal(){document.getElementById('modal').style.display='none'}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function openClient(id){const c=db.clients.find(x=>x.id===id)||{name:'',type:'Professionnel',phone:'',email:'',city:'',notes:''};openModal('CLIENT',id?'Modifier le client':'Nouveau client','Les informations seront reliées à vos prestations.',`<div class="form"><div class="field"><label>Nom / société *</label><input id="f_name" value="${esc(c.name)}"></div><div class="field"><label>Type</label><select id="f_type">${['Particulier','Professionnel','Association','Collectivité'].map(x=>`<option ${x===c.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Téléphone</label><input id="f_phone" value="${esc(c.phone)}"></div><div class="field"><label>Email</label><input id="f_email" value="${esc(c.email)}"></div><div class="field"><label>Ville</label><input id="f_city" value="${esc(c.city)}"></div><div class="field full"><label>Notes</label><textarea id="f_notes">${esc(c.notes)}</textarea></div></div><div class="foot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveClient('${id||''}')">✓ Enregistrer</button></div>`)}
function saveClient(id){const name=document.getElementById('f_name').value.trim();if(!name)return toast('Le nom est obligatoire');const o={id:id||uid('cli'),companyId:db.activeCompany,name,type:document.getElementById('f_type').value,phone:document.getElementById('f_phone').value,email:document.getElementById('f_email').value,city:document.getElementById('f_city').value,notes:document.getElementById('f_notes').value};const i=db.clients.findIndex(x=>x.id===id);if(i>=0)db.clients[i]=o;else db.clients.push(o);save();renderAll();closeModal();go('clients');toast('Client enregistré')}
function openSupplier(id){const s=db.suppliers.find(x=>x.id===id)||{};openModal('FOURNISSEUR',id?'Modifier le fournisseur':'Nouveau fournisseur','Une fiche centrale pour les achats et produits.',`<div class="form"><div class="field"><label>Société *</label><input id="f_name" value="${esc(s.name)}"></div><div class="field"><label>Contact</label><input id="f_contact" value="${esc(s.contact)}"></div><div class="field"><label>Téléphone</label><input id="f_phone" value="${esc(s.phone)}"></div><div class="field"><label>Email</label><input id="f_email" value="${esc(s.email)}"></div><div class="field"><label>Adresse</label><input id="f_address" value="${esc(s.address)}"></div><div class="field"><label>Ville</label><input id="f_city" value="${esc(s.city)}"></div><div class="field"><label>SIRET</label><input id="f_siret" value="${esc(s.siret)}"></div><div class="field"><label>Conditions de paiement</label><input id="f_pay" value="${esc(s.paymentTerms)}" placeholder="30 jours, comptant…"></div><div class="field"><label>Livraison / retrait</label><input id="f_delivery" value="${esc(s.delivery)}"></div><div class="field"><label>Minimum de commande</label><input id="f_min" value="${esc(s.minOrder)}"></div><div class="field full"><label>Notes</label><textarea id="f_notes">${esc(s.notes)}</textarea></div></div><div class="foot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveSupplier('${id||''}')">✓ Enregistrer</button></div>`)}
function saveSupplier(id){const name=document.getElementById('f_name').value.trim();if(!name)return toast('Le fournisseur est obligatoire');const o={id:id||uid('sup'),companyId:db.activeCompany,name,contact:document.getElementById('f_contact').value,phone:document.getElementById('f_phone').value,email:document.getElementById('f_email').value,address:document.getElementById('f_address').value,city:document.getElementById('f_city').value,siret:document.getElementById('f_siret').value,paymentTerms:document.getElementById('f_pay').value,delivery:document.getElementById('f_delivery').value,minOrder:document.getElementById('f_min').value,notes:document.getElementById('f_notes').value};const i=db.suppliers.findIndex(x=>x.id===id);if(i>=0)db.suppliers[i]=o;else db.suppliers.push(o);save();renderAll();closeModal();go('suppliers');toast('Fournisseur enregistré')}
function openProduct(id){const p=db.products.find(x=>x.id===id)||{name:'',category:'',unit:'kg',packaging:'',priceHT:0,vat:5.5,supplierId:'',supplierRef:'',internalRef:'',barcode:'',minStock:0,stock:0};const opts=companyItems('suppliers').map(s=>`<option value="${s.id}" ${s.id===p.supplierId?'selected':''}>${esc(s.name)}</option>`).join('');openModal('CATALOGUE PRODUIT',id?'Modifier le produit':'Nouveau produit','Cette référence alimente le stock, les achats et les recettes.',`<div class="form"><div class="field"><label>Nom *</label><input id="f_name" value="${esc(p.name)}"></div><div class="field"><label>Famille</label><input id="f_cat" value="${esc(p.category)}"></div><div class="field"><label>Unité</label><select id="f_unit">${['kg','L','pièce','carton','portion','unité'].map(x=>`<option ${x===p.unit?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Conditionnement</label><input id="f_pack" value="${esc(p.packaging)}" placeholder="6 x 1 L, carton 10 kg…"></div><div class="field"><label>Prix achat HT</label><input id="f_price" type="number" step="0.01" value="${n(p.priceHT)}"></div><div class="field"><label>TVA %</label><input id="f_vat" type="number" step="0.1" value="${n(p.vat)||5.5}"></div><div class="field"><label>Fournisseur principal</label><select id="f_supplier"><option value="">—</option>${opts}</select></div><div class="field"><label>Référence fournisseur</label><input id="f_sref" value="${esc(p.supplierRef)}"></div><div class="field"><label>Référence MARYSE</label><input id="f_iref" value="${esc(p.internalRef)}" placeholder="Auto"></div><div class="field"><label>EAN / GTIN</label><input id="f_barcode" value="${esc(p.barcode)}"></div><div class="field"><label>Seuil minimum</label><input id="f_min" type="number" step="0.01" value="${n(p.minStock)}"></div><div class="field"><label>Stock initial / actuel</label><input id="f_stock" type="number" step="0.01" value="${n(p.stock)}"></div></div><div class="foot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveProduct('${id||''}')">✓ Enregistrer</button></div>`)}
function saveProduct(id){const name=document.getElementById('f_name').value.trim();if(!name)return toast('Le nom est obligatoire');const o={id:id||uid('prd'),companyId:db.activeCompany,name,category:document.getElementById('f_cat').value,unit:document.getElementById('f_unit').value,packaging:document.getElementById('f_pack').value,priceHT:n(document.getElementById('f_price').value),vat:n(document.getElementById('f_vat').value),supplierId:document.getElementById('f_supplier').value,supplierRef:document.getElementById('f_sref').value,internalRef:document.getElementById('f_iref').value||('MARYSE-'+String(db.products.length+1).padStart(5,'0')),barcode:document.getElementById('f_barcode').value,minStock:n(document.getElementById('f_min').value),stock:n(document.getElementById('f_stock').value)};const i=db.products.findIndex(x=>x.id===id);if(i>=0)db.products[i]=o;else db.products.push(o);let inv=db.inventory.find(x=>x.productId===o.id&&x.companyId===db.activeCompany);if(!inv)db.inventory.push({id:uid('inv'),companyId:db.activeCompany,productId:o.id,name:o.name,unit:o.unit,theoretical:o.stock,real:o.stock,threshold:o.minStock});else{inv.name=o.name;inv.unit=o.unit;inv.threshold=o.minStock;if(!id){inv.real=o.stock;inv.theoretical=o.stock}}save();renderAll();closeModal();go('catalog');toast('Produit enregistré et relié au stock')}
function openRecipe(id){const r=db.recipes.find(x=>x.id===id)||{name:'',yield:10,sale:0,cost:0,notes:'',presentation:'',ingredients:[],photo:''};const rows=(r.ingredients||[]).map((x,i)=>ingredientRow(x,i)).join('');openModal('RECETTE',id?'Modifier la fiche recette':'Nouvelle fiche recette','Ajoutez les ingrédients : MARYSE calcule le coût matière depuis le catalogue.',`<div class="form"><div class="field"><label>Nom *</label><input id="r_name" value="${esc(r.name)}"></div><div class="field"><label>Rendement / portions</label><input id="r_yield" type="number" value="${n(r.yield)||1}"></div><div class="field"><label>Prix de vente / portion</label><input id="r_sale" type="number" step="0.01" value="${n(r.sale)}"></div><div class="field"><label>Coût matière calculé</label><input id="r_cost" readonly value="${n(r.cost).toFixed(2)}"></div><div class="field full"><label>Ingrédients</label><div id="ingredients">${rows||ingredientRow({},0)}</div><button class="btn small" type="button" onclick="addIngredient()">+ Ajouter un ingrédient</button></div><div class="field"><label>Matériel / équipement</label><textarea id="r_mat">${esc(r.material||'')}</textarea></div><div class="field"><label>Présentation souhaitée</label><textarea id="r_pres">${esc(r.presentation||'')}</textarea></div><div class="field"><label>Photo de référence</label><input id="r_photo" type="file" accept="image/*" capture="environment"><div class="photo-preview" id="r_preview">${r.photo?`<img src="${r.photo}">`:''}</div></div><div class="field"><label>Notes / méthode</label><textarea id="r_notes">${esc(r.notes||'')}</textarea></div></div><div class="foot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveRecipe('${id||''}')">✓ Enregistrer la fiche</button></div>`);document.getElementById('r_photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>document.getElementById('r_preview').innerHTML=`<img src="${rd.result}">`;rd.readAsDataURL(f)};updateRecipeCost()}
